name: workflow_dispatch
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'set Name'
        required: true
        default: 'github-actions'
        type: string
      environment:
        description: 'set env'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod

jobs:
  workflow-dispatch-job:
    runs-on: ubuntu-latest
    steps:
      - name: step1
        run: echo "Hello, ${{ github.actor }}"
      - name: step2
        run: |
          echo "Hello, ${{ github.actor }}"
          echo "Hello, ${{ github.repository }}"
      - name: echo inputs
        run: |
          echo "Hello, ${{ inputs.name }}"
          echo "Hello, ${{ inputs.environment }}"